# Frontend on Netlify; /api is proxied to the backend on Render, so the browser
# sees one origin and no CORS setup is needed.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://startcode-august-api.onrender.com/api/:splat"
  status = 200
  force = true

# The app uses a history-API router, so every other path serves the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
