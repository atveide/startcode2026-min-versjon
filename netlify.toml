# Frontend on Netlify; /api is proxied to the backend on Render, so the browser
# sees one origin and no CORS setup is needed. The whole site is behind a password
# (netlify/edge-functions/password.ts, SITE_PASSWORD), which runs before the redirects.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[[redirects]]
  from = "/api/*"
  to = "https://startcode-august-api.onrender.com/api/:splat"
  status = 200
  force = true

# Adressa's videos and posters, copied into the build from backend/media/videos.
[[headers]]
  for = "/media/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The app uses a history-API router, so every other path serves the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
